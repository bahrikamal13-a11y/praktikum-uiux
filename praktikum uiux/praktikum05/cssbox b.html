<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box dan Positioning - Gambar 4</title>
    <link rel="stylesheet" href="css/cssbox b.css">
</head>
<body>
    <div class="container">
        <!-- Baris Atas -->
        <div class="top-row">
            <div class="box-kuning"></div>
            <div class="box-oranye"></div>
        </div>

        <!-- Baris Tengah -->
        <div class="middle-row">
            <div class="box-hijau"></div>
            <div class="box-abu"></div>
            <div class="box-cyan"></div>
        </div>

        <!-- Baris Bawah -->
        <div class="box-biru"></div>
    </div>
</body>
</html>
